<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tetris Attack</title>
  <style>
    body { overflow: hidden; background: #000000; margin: 0; }
    #startButton { display: block; width: 160px; height: 40px; background-color: #4CAF50; color: white; text-align: center; font-size: 16px; margin: 20px auto; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Press Start 2P', cursive; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div style="width: 100vw; height: 100vh;">
    <div id="game" style="display: none;"></div>
    <button id="startButton">PLAY</button>
  </div>
  <script>
    function startGame() {
      document.getElementById("game").style.display = "block";
      document.getElementById("startButton").style.display = "none";
      EJS_player = "#game";
      EJS_core = "snes";
      EJS_color = "#000000";
      EJS_startOnLoaded = true;
      EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";
      EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/clsm64@083df42a6f197fcd23f5eed15b80faf80f5275ad/Tetris%20Attack%20(U)%20%5B!%5D.zip";
      var script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
      document.body.appendChild(script);
    }
    document.getElementById("startButton").addEventListener("click", startGame);
  </script>
</body>
</html>
