  window.EJS_core = "coleco";

  window.EJS_pathtodata = "../_shared/emu/";
  window.EJS_biosUrl = "assets/cdn/78ea75ab-colecovision.rom";
  window.EJS_gameUrl = "assets/cdn/c6c9e357-Root_Beer_Tapper_USA_.zip";

  script.src = "../_shared/6515c3799bdb-loader.js";
  document.body.appendChild(script);
};
</script>

</html>
