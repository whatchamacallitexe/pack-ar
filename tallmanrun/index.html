<!DOCTYPE html>
<html lang="en-us">
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<base href="https://rawcdn.githack.com/bubbls/youtube-playables/8b29ce29cd86c8fb4f46fa5b63d3a0f4f32c5d4e/tall-man-run/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tall Man Run</title>
<link rel="stylesheet" href="TemplateData/style.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;}</style>
</head>
<body>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="unity-loading-bar">
<div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
</div>
</div>
<script>
var canvas = document.querySelector("#unity-canvas");
var progressBarFull = document.querySelector("#unity-progress-bar-full");
var buildUrl = "Build";
var loaderUrl = buildUrl + "/TallManRun_1.0.20.loader.js";
var config = {
  dataUrl: buildUrl + "/TallManRun_1.0.20.data",
  frameworkUrl: buildUrl + "/TallManRun_1.0.20.framework.js",
  codeUrl: buildUrl + "/TallManRun_1.0.20.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "VectorUp Games",
  productName: "Tall Man Run",
  productVersion: "1.45"
};
var script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    progressBarFull.style.width = 100 * progress + "%";
  }).then(() => {
    document.querySelector("#unity-loading-bar").style.display = "none";
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
